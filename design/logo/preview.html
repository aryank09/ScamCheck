<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ScamCheck logo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #efeae2; color: #1c1714; font-family: Inter, Helvetica Neue, Arial, sans-serif; }
    main { width: 1080px; margin: 0 auto; padding: 40px 36px 48px; }
    h1 { font-weight: 500; letter-spacing: -0.04em; font-size: 22px; margin: 0 0 6px; }
    p { margin: 0 0 22px; color: #6d645c; font-size: 15px; }
    .label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #6d645c; margin: 18px 0 8px; }
    .row { display: flex; gap: 14px; align-items: center; }
    .tile { border-radius: 18px; display: flex; align-items: center; justify-content: center; }
    .paper { background: #f3efe6; }
    .night { background: #161311; }
    img { display: block; }
  </style>
</head>
<body>
  <main>
    <h1>ScamCheck</h1>
    <p>One check, drawn as two strokes. The short ink stroke starts it. The longer clay stroke finishes it.</p>
    <div class="label">Mark</div>
    <div class="row">
      <div class="tile paper" style="width:148px;height:148px"><img src="mark.svg" width="96" height="96" alt=""></div>
      <div class="tile paper" style="width:148px;height:148px"><img src="mark-two-color.svg" width="96" height="96" alt=""></div>
      <div class="tile night" style="width:148px;height:148px"><img src="app-icon-dark.svg" width="96" height="96" alt=""></div>
    </div>
    <div class="label">Wordmark</div>
    <div class="row">
      <div class="tile paper" style="height:84px;padding:0 28px"><img src="wordmark.svg" height="40" alt=""></div>
    </div>
    <div class="label">Lockup</div>
    <div class="row">
      <img src="lockup-on-light.svg" height="88" alt="">
      <img src="lockup-on-dark.svg" height="88" alt="">
    </div>
    <div class="label">App icon and small sizes</div>
    <div class="row">
      <img src="app-icon-light.svg" width="80" height="80" alt="">
      <img src="app-icon-dark.svg" width="80" height="80" alt="">
      <div class="tile paper" style="height:80px;padding:0 18px;gap:14px;display:flex;align-items:center">
        <img src="mark-two-color.svg" width="16" height="16" alt="">
        <img src="mark-two-color.svg" width="24" height="24" alt="">
        <img src="mark-two-color.svg" width="32" height="32" alt="">
      </div>
    </div>
  </main>
</body>
</html>
